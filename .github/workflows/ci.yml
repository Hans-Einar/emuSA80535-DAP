name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:contract
      - run: npm run fixture:check
      - run: npm run package
      - run: npm run package:contents
      - run: npm run package:policy
      - name: Install and smoke packaged VSIX at VS Code floor
        run: xvfb-run -a npm run smoke:vsix

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:contract
      - run: npm run fixture:check
      - run: npm run package
      - run: npm run package:contents
      - run: npm run package:policy
      - name: Install and smoke packaged VSIX at VS Code floor
        run: npm run smoke:vsix
